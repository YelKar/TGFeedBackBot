<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Analytics Pro</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Merriweather:ital,wght@1,400;1,700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .quote-font { font-family: 'Merriweather', serif; font-style: italic; font-weight: 400; }
        .preserve-lines { white-space: pre-wrap; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .sticker-container svg { width: 32px !important; height: 32px !important; display: block; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useMemo, useRef, useEffect, createContext, useContext } = React;

        const INITIAL_ANON_PRIORITY = ['аноним', 'неизвестн', 'студ', 'разраб'];
        const INITIAL_ALIASES = [
            ["Из рабочих коммуникаций", "Рабочие коммуникации", "РК"],
            ["Мужчины в бане", "Банный чат"],
            ["403а", "Кабинет 403"]
        ];
        const EXCLUSION_WORDS = ['соответственно', 'группа', 'когда', 'после', 'вчера', 'сегодня', 'преподаватель'];
        const CONTEXT_MARKERS = [" в ", " на ", " при ", " за ", " от ", " с ", " из ", " про ", " у "];
        const FileContext = createContext(new Map());
        const PAGE_SIZE = 30;

        const FormattedQuote = ({ text }) => {
            const regex = /(\/\*[\s\S]*?\*\/|(?<=^|\n)\*(?!\*)[^*]+?\*(?=\n|$)|^\*(?!\*)[^*]+?\*(?=\s)|(?<=\s)\*(?!\*)[^*]+?\*$)/g;
            const parts = text.split(regex);
            return (
                <span className="preserve-lines leading-relaxed">
                    {parts.map((part, i) => {
                        if (!part) return null;
                        const isMatch = part.startsWith('/*') || (part.startsWith('*') && part.endsWith('*') && !part.startsWith('**'));
                        if (isMatch) {
                            const content = part.replace(/^\/\*|\*\/$|^\*|\*$/g, '').trim();
                            return <span key={i} className="inline-block bg-slate-400/10 text-slate-500 px-1.5 py-0.5 rounded-lg text-[0.85em] quote-font not-italic tracking-tight border border-slate-200/30 my-0.5 align-middle">{content}</span>;
                        }
                        return part;
                    })}
                </span>
            );
        };

        const LazyCard = ({ children, height = "200px" }) => {
            const [isVisible, setIsVisible] = useState(false);
            const containerRef = useRef(null);
            useEffect(() => {
                const observer = new IntersectionObserver(([entry]) => setIsVisible(entry.isIntersecting), { rootMargin: '400px' });
                if (containerRef.current) observer.observe(containerRef.current);
                return () => observer.disconnect();
            }, []);
            return <div ref={containerRef} style={{ minHeight: isVisible ? 'auto' : height }}>{isVisible ? children : <div className="w-full bg-white/50 rounded-[2.5rem] animate-pulse" style={{ height }} />}</div>;
        };

        const StickerProvider = ({ path, size = "w-8 h-8" }) => {
            const containerRef = useRef(null);
            const animRef = useRef(null);
            const fileMap = useContext(FileContext);
            const [isLoaded, setIsLoaded] = useState(false);
            const cleanPath = path ? path.replace(/.*ChatExport_.*?\//, '') : '';
            const blobUrl = fileMap.get(cleanPath);
            useEffect(() => {
                if (blobUrl && cleanPath.endsWith('.tgs') && containerRef.current) {
                    fetch(blobUrl).then(res => res.arrayBuffer()).then(buffer => {
                        const decompressed = pako.ungzip(new Uint8Array(buffer), { to: 'string' });
                        if (animRef.current) animRef.current.destroy();
                        animRef.current = lottie.loadAnimation({
                            container: containerRef.current, renderer: 'svg', loop: true, autoplay: false,
                            animationData: JSON.parse(decompressed)
                        });
                        setIsLoaded(true);
                    }).catch(console.error);
                    return () => { if (animRef.current) animRef.current.destroy(); };
                }
            }, [blobUrl, cleanPath]);
            if (!blobUrl) return <span className="text-xs opacity-30">🖼️</span>;
            if (cleanPath.endsWith('.webp')) return <img src={blobUrl} className={`${size} object-contain`} alt="" loading="lazy" />;
            if (cleanPath.endsWith('.webm')) return <video src={blobUrl} className={`${size} object-contain rounded-full`} autoPlay={false} loop muted onMouseEnter={e => e.target.play()} onMouseLeave={e => { e.target.pause(); e.target.currentTime = 0; }}/>;
            return <div ref={containerRef} className={`${size} sticker-container flex items-center justify-center`} onMouseEnter={() => animRef.current?.play()} onMouseLeave={() => { animRef.current?.stop(); animRef.current?.goToAndStop(0, true); }}>{!isLoaded && <div className="w-4 h-4 rounded-full bg-slate-200 animate-pulse"></div>}</div>;
        };

        function App() {
            const [data, setData] = useState(null);
            const [fileMap, setFileMap] = useState(new Map());
            const [activeTab, setActiveTab] = useState('overview');
            const [filterAuthor, setFilterAuthor] = useState(null);
            const [filterTag, setFilterTag] = useState(null);
            const [searchQuery, setSearchQuery] = useState("");
            const [visibleCount, setVisibleCount] = useState(PAGE_SIZE);
            const [sortOrder, setSortOrder] = useState('popular');
            const [aliases, setAliases] = useState(INITIAL_ALIASES);
            const [anonPriority, setAnonPriority] = useState(INITIAL_ANON_PRIORITY);

            const handleFolderUpload = async (event) => {
                const files = Array.from(event.target.files);
                const newMap = new Map();
                let jsonData = null;
                for (const file of files) {
                    const parts = file.webkitRelativePath.split('/'); parts.shift();
                    const url = URL.createObjectURL(file);
                    newMap.set(parts.join('/'), url);
                    if (file.name === 'result.json') jsonData = JSON.parse(await file.text());
                }
                if (jsonData) { setFileMap(newMap); setData(jsonData); }
            };

            const stats = useMemo(() => {
                if (!data) return null;
                const authorAggregation = {}; const tagStats = {}; const reactionCounts = {};
                let announcementCount = 0;
                const authorDelimiterRegex = /[©ⓒⒸ]|\(c\)/i;
                const messages = data.messages.filter(m => m.type === 'message');

                // 1. Лингвистическое имя (Большая буква)
                function getLeadingName(text) {
                    for (let group of aliases) {
                        for (let variation of group) {
                            if (text.toLowerCase().startsWith(variation.toLowerCase())) return variation;
                        }
                    }
                    const words = text.split(/(\s+)/);
                    let gathered = "";
                    for (let word of words) {
                        const clean = word.trim().replace(/[.,!?;:]/g, "");
                        if (!clean) { if (gathered) gathered += word; continue; }
                        const isUpper = clean[0] === clean[0].toUpperCase() && clean[0] !== clean[0].toLowerCase();
                        if (isUpper && !EXCLUSION_WORDS.includes(clean.toLowerCase())) gathered += word;
                        else break;
                    }
                    return gathered.trim();
                }

                // 2. Кластеризация
                const uniqueNamesFound = new Set();
                messages.forEach(m => {
                    const rawText = Array.isArray(m.text) ? m.text.map(t => typeof t === 'object' ? t.text : t).join("") : m.text || "";
                    const parts = rawText.split(authorDelimiterRegex);
                    if (parts.length > 1) {
                        const authorPart = parts[parts.length - 1].split('\n')[0].trim();
                        authorPart.split(/(\s+и\s+)/).forEach(p => {
                            if (p.match(/\s+и\s+/)) return;
                            if (anonPriority.some(root => p.toLowerCase().includes(root))) return;
                            p.split(/,\s*/).forEach(sn => {
                                const name = getLeadingName(sn);
                                if (name.length > 1) uniqueNamesFound.add(name);
                            });
                        });
                    }
                });

                const sortedUnique = Array.from(uniqueNamesFound).sort((a, b) => b.length - a.length);
                const baseNames = [];
                sortedUnique.forEach(name => {
                    const words = name.toLowerCase().replace(/[.,!?;:]/g, "").split(/\s+/).filter(w => w.length > 1);
                    let isSubsetOfAny = false;
                    for (let base of baseNames) {
                        const baseWords = base.toLowerCase().replace(/[.,!?;:]/g, "").split(/\s+/).filter(w => w.length > 1);
                        if (words.every(w => baseWords.includes(w))) { isSubsetOfAny = true; break; }
                    }
                    if (!isSubsetOfAny) baseNames.push(name);
                });

                const canonicalMap = new Map();
                sortedUnique.forEach(name => {
                    const words = name.toLowerCase().replace(/[.,!?;:]/g, "").split(/\s+/).filter(w => w.length > 1);
                    const parents = baseNames.filter(base => {
                        const baseWords = base.toLowerCase().replace(/[.,!?;:]/g, "").split(/\s+/).filter(w => w.length > 1);
                        return words.every(w => baseWords.includes(w));
                    });
                    canonicalMap.set(name, parents.length === 1 ? parents[0] : name);
                });

                // 3. Сборка
                const processedMessages = messages.map(m => {
                    let rawText = Array.isArray(m.text) ? m.text.map(t => typeof t === 'object' ? t.text : t).join("") : m.text || "";
                    const hashtagEntities = (m.text_entities || []).filter(e => e.type === 'hashtag');
                    const tags = hashtagEntities.map(e => e.text.replace('#', ''));
                    tags.forEach(t => tagStats[t] = (tagStats[t] || 0) + 1);

                    const authorDelimiter = rawText.split(authorDelimiterRegex);
                    let cleanText = rawText; let visualSegments = []; let involvedCanonicalAuthors = []; let fullAuthorString = ""; let isAnnouncement = false;

                    if (authorDelimiter.length > 1) {
                        fullAuthorString = authorDelimiter[authorDelimiter.length - 1].split('\n')[0].trim();
                        const lastIndex = rawText.lastIndexOf(authorDelimiter[authorDelimiter.length - 1]);
                        cleanText = rawText.substring(0, lastIndex).replace(new RegExp(`${authorDelimiterRegex.source}\\s*$`), "").trim();

                        const chunks = fullAuthorString.split(/(\s+[иИ]\s+)/);
                        chunks.forEach(chunk => {
                            if (chunk.match(/\s+[иИ]\s+/)) { visualSegments.push({ type: 'text', val: chunk }); return; }

                            const hasAnon = anonPriority.some(root => chunk.toLowerCase().includes(root));
                            if (hasAnon) {
                                involvedCanonicalAuthors.push("👤 Аноним");
                                let bestRoot = anonPriority.find(root => chunk.toLowerCase().includes(root));
                                const wordRegex = new RegExp(`(\\S*${bestRoot}\\S*)`, 'i');
                                const match = chunk.match(wordRegex);
                                if (match) {
                                    const targetWord = match[0];
                                    const tIdx = chunk.indexOf(targetWord);
                                    const before = chunk.substring(0, tIdx);
                                    const after = chunk.substring(tIdx + targetWord.length);
                                    if (before) visualSegments.push({ type: 'text', val: before });
                                    visualSegments.push({ type: 'link', val: targetWord, canonical: "👤 Аноним" });
                                    if (after) visualSegments.push({ type: 'text', val: after });
                                } else { visualSegments.push({ type: 'link', val: chunk, canonical: "👤 Аноним" }); }
                            } else {
                                const subNames = chunk.split(/(,\s*)/);
                                subNames.forEach(sn => {
                                    if (sn.match(/,\s*/)) { visualSegments.push({ type: 'text', val: sn }); return; }
                                    const namePart = getLeadingName(sn);
                                    const contextPart = sn.substring(namePart.length);
                                    if (namePart) {
                                        let cName = namePart.trim();
                                        const aliasGroup = aliases.find(g => g.some(v => v.toLowerCase() === cName.toLowerCase()));
                                        if (aliasGroup) cName = aliasGroup[0];
                                        else cName = canonicalMap.get(cName) || cName;
                                        involvedCanonicalAuthors.push(cName);
                                        visualSegments.push({ type: 'link', val: namePart, canonical: cName });
                                    }
                                    if (contextPart) visualSegments.push({ type: 'text', val: contextPart });
                                });
                            }
                        });
                    } else { isAnnouncement = true; announcementCount++; cleanText = rawText; }

                    hashtagEntities.forEach(entity => { cleanText = cleanText.replace(entity.text, ""); });
                    cleanText = cleanText.replace(/^\s+|\s+$/g, '');
                    const reactionsScore = (m.reactions || []).reduce((acc, r) => acc + r.count, 0);
                    const reactionsDetail = (m.reactions || []).map(r => {
                        let label = r.type === 'paid' ? "⭐️" : (r.document_id || r.emoji);
                        reactionCounts[r.type === 'paid' ? "⭐️ [Stars]" : label] = (reactionCounts[r.type === 'paid' ? "⭐️ [Stars]" : label] || 0) + r.count;
                        return { label, count: r.count, isCustom: !!r.document_id, isPaid: r.type === 'paid' };
                    });

                    if (!isAnnouncement) {
                        [...new Set(involvedCanonicalAuthors)].forEach(auth => {
                            if (!authorAggregation[auth]) authorAggregation[auth] = { name: auth, count: 0, reactions: 0 };
                            authorAggregation[auth].count++; authorAggregation[auth].reactions += reactionsScore;
                        });
                    }
                    return { ...m, visualSegments, involvedCanonicalAuthors, fullAuthorString, tags, reactionsScore, reactionsDetail, cleanText, isAnnouncement, dateObj: new Date(m.date) };
                });

                return {
                    total: processedMessages.length - announcementCount, announcementsTotal: announcementCount,
                    authors: Object.values(authorAggregation).sort((a, b) => b.count - a.count),
                    tags: Object.entries(tagStats).sort((a, b) => b[1] - a[1]),
                    reactionCounts: Object.entries(reactionCounts).sort((a, b) => b[1] - a[1]),
                    allMessages: processedMessages
                };
            }, [data, aliases, anonPriority]);

            useEffect(() => {
                const handleScroll = () => { if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500) setVisibleCount(prev => prev + PAGE_SIZE); };
                window.addEventListener('scroll', handleScroll); return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            useEffect(() => setVisibleCount(PAGE_SIZE), [filterAuthor, filterTag, searchQuery, activeTab, sortOrder]);

            const filteredFeed = useMemo(() => {
                if (!stats) return [];
                const query = searchQuery.toLowerCase().trim();
                let result = stats.allMessages.filter(m => {
                    if (activeTab === 'announcements') return m.isAnnouncement;
                    if (activeTab !== 'feed') return true;
                    const matchAuth = filterAuthor ? m.involvedCanonicalAuthors.includes(filterAuthor) : true;
                    const matchTag = filterTag ? m.tags.includes(filterTag) : true;
                    const matchSearch = query === "" || m.cleanText.toLowerCase().includes(query) || m.fullAuthorString.toLowerCase().includes(query) || m.tags.some(t => t.toLowerCase().includes(query));
                    return matchAuth && matchTag && matchSearch && !m.isAnnouncement;
                });
                return result.sort((a, b) => {
                    if (query !== "") {
                        const aRel = a.fullAuthorString.toLowerCase().includes(query) ? 1000 : 0;
                        const bRel = b.fullAuthorString.toLowerCase().includes(query) ? 1000 : 0;
                        if (aRel !== bRel) return bRel - aRel;
                    }
                    if (sortOrder === 'popular') return b.reactionsScore - a.reactionsScore;
                    if (sortOrder === 'newest') return b.dateObj - a.dateObj;
                    return a.dateObj - b.dateObj;
                });
            }, [stats, filterAuthor, filterTag, searchQuery, activeTab, sortOrder]);

            const visibleFeed = useMemo(() => filteredFeed.slice(0, visibleCount), [filteredFeed, visibleCount]);

            if (!data) return (
                <div className="flex flex-col items-center justify-center min-h-screen bg-slate-900 text-white p-6 text-center font-black">
                    <div className="w-20 h-20 bg-indigo-500 rounded-3xl mb-8 flex items-center justify-center text-4xl shadow-2xl animate-bounce">📊</div>
                    <h1 className="text-4xl font-extrabold mb-4 tracking-tight">Архив Цитат</h1>
                    <label className="group relative block cursor-pointer mt-4">
                        <div className="absolute -inset-1 bg-gradient-to-r from-indigo-600 to-purple-600 rounded-2xl blur opacity-75 group-hover:opacity-100 transition duration-1000"></div>
                        <div className="relative bg-slate-800 px-10 py-5 rounded-2xl font-bold flex items-center gap-3 border border-slate-700">📂 Выбрать папку чата<input type="file" webkitdirectory="true" directory="true" onChange={handleFolderUpload} className="hidden" /></div>
                    </label>
                </div>
            );

            return (
                <FileContext.Provider value={fileMap}>
                <div className="min-h-screen flex flex-col">
                    <header className="bg-white/80 backdrop-blur-md border-b sticky top-0 z-50">
                        <div className="max-w-6xl mx-auto px-4 h-20 flex items-center justify-between gap-4 font-black text-slate-800">
                            <div className="flex items-center gap-4 cursor-pointer shrink-0" onClick={() => {setFilterAuthor(null); setFilterTag(null); setSearchQuery(""); setActiveTab('overview');}}>
                                <div className="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-black text-xl shadow-lg">Q</div>
                                <h1 className="text-xl font-bold hidden lg:block">{data.name}</h1>
                            </div>
                            {(activeTab === 'feed' || activeTab === 'announcements') && (
                                <div className="flex-grow max-w-md relative group">
                                    <input type="text" placeholder="Поиск..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full bg-slate-100 border-none rounded-2xl py-2.5 pl-11 pr-4 text-sm font-semibold focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all font-bold"/>
                                    <span className="absolute left-4 top-1/2 -translate-y-1/2 opacity-30 text-xs font-black">🔍</span>
                                </div>
                            )}
                            <div className="flex bg-slate-100 rounded-xl p-1 shrink-0 overflow-x-auto custom-scrollbar font-black">
                                {[{id:'overview', label:'Обзор'}, {id:'authors', label:'Авторы'}, {id:'tags', label:'Теги'}, {id:'feed', label:'Лента'}, {id:'announcements', label:'Объявления'}, {id:'settings', label:'⚙️'}].map(tab => (
                                    <button key={tab.id} onClick={() => {setActiveTab(tab.id); setFilterAuthor(null); setFilterTag(null);}} className={`px-4 py-2 rounded-lg text-sm font-bold transition-all whitespace-nowrap ${activeTab === tab.id ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}>{tab.label}</button>
                                ))}
                            </div>
                        </div>
                    </header>

                    <main className="flex-grow max-w-6xl w-full mx-auto p-4 md:p-8 font-black text-slate-800">
                        {activeTab === 'overview' && (
                            <div className="space-y-8 animate-in fade-in duration-500">
                                <div className="grid grid-cols-2 lg:grid-cols-5 gap-4">
                                    <StatCard label="Цитат" value={stats.total} icon="📝" />
                                    <StatCard label="Авторов" value={stats.authors.length} icon="👥" />
                                    <StatCard label="Объявлений" value={stats.announcementsTotal} icon="📢" colorClass="text-orange-500" />
                                    <StatCard label="Тегов" value={stats.tags.length} icon="🏷️" />
                                    <StatCard label="Топ эмодзи" value={stats.reactionCounts[0]?.[0]} icon="🔥" isCustom={stats.reactionCounts[0]?.[0]?.includes('/')} isPaid={stats.reactionCounts[0]?.[0] === '⭐️'} />
                                </div>
                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-8 text-slate-800">
                                    <div className="lg:col-span-2 bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-100">
                                        <h2 className="text-xl font-bold mb-6 flex items-center gap-3">Популярные реакции</h2>
                                        <div className="flex flex-wrap gap-4">
                                            {stats.reactionCounts.slice(0, 24).map(([label, count]) => (
                                                <div key={label} className={`flex items-center pl-2 pr-4 py-2 rounded-2xl border group transition-all ${label === '⭐️ [Stars]' ? 'bg-amber-50 border-amber-200' : 'bg-slate-50 border-slate-100'}`}>
                                                    <div className="w-10 h-10 flex items-center justify-center mr-1 font-black">{label === '⭐️ [Stars]' ? <span className="text-3xl">⭐️</span> : label.includes('/') ? <StickerProvider path={label} /> : <span className="text-3xl leading-none">{label}</span>}</div>
                                                    <span className={`font-black ${label === '⭐️ [Stars]' ? 'text-amber-700' : 'text-slate-700'}`}>{count}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="bg-indigo-600 p-8 rounded-[2.5rem] shadow-xl text-white">
                                        <h2 className="text-xl font-bold mb-6 uppercase tracking-widest text-xs opacity-80 font-black">Топ тегов</h2>
                                        <div className="space-y-4">
                                            {stats.tags.slice(0, 5).map(([tag, count]) => (
                                                <div key={tag} className="flex justify-between items-center group cursor-pointer font-black font-black" onClick={() => {setFilterTag(tag); setActiveTab('feed');}}><span className="font-bold opacity-80 group-hover:opacity-100 transition-opacity">#{tag}</span><span className="bg-white/20 px-3 py-1 rounded-lg text-sm font-bold">{count}</span></div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'authors' && (
                            <div className="bg-white rounded-[2.5rem] shadow-sm border border-slate-100 overflow-hidden animate-in fade-in duration-500 font-black text-slate-800">
                                <table className="w-full text-left border-collapse font-black text-slate-800">
                                    <thead><tr className="bg-slate-50/50 text-slate-400 text-[10px] uppercase tracking-[0.2em] font-bold"><th className="px-8 py-6">Имя автора</th><th className="px-8 py-6 text-center">Цитат</th><th className="px-8 py-6 text-center font-black">Реакций</th><th className="px-8 py-6 text-right font-black">Среднее</th></tr></thead>
                                    <tbody className="divide-y divide-slate-50 font-black text-slate-800">{stats.authors.map((a, i) => (
                                        <tr key={i} className="hover:bg-indigo-50/30 transition cursor-pointer group font-black" onClick={() => {setFilterAuthor(a.name); setActiveTab('feed');}}><td className="px-8 py-6 font-bold text-slate-700 group-hover:text-indigo-600 transition-all font-black">{a.name}</td><td className="px-8 py-6 text-center font-semibold text-slate-500 font-black font-black">{a.count}</td><td className="px-8 py-6 text-center font-semibold text-slate-500 font-black font-black">{a.reactions}</td><td className="px-8 py-6 text-right font-black text-indigo-500 font-black font-black font-black">{(a.reactions / a.count).toFixed(1)}</td></tr>
                                    ))}</tbody>
                                </table>
                            </div>
                        )}

                        {activeTab === 'tags' && (
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 animate-in zoom-in-95 duration-300 font-black text-slate-800">
                                {stats.tags.map(([tag, count]) => (
                                    <div key={tag} onClick={() => {setFilterTag(tag); setActiveTab('feed');}} className="bg-white p-8 rounded-[2rem] border border-slate-100 hover:border-indigo-400 transition-all cursor-pointer group shadow-sm font-black"><div className="text-indigo-600 font-black text-xl mb-2 group-hover:scale-105 origin-left transition-transform font-black">#{tag}</div><div className="text-slate-400 font-bold text-sm"> {count} сообщений</div></div>
                                ))}
                            </div>
                        )}

                        {activeTab === 'settings' && (
                            <div className="max-w-4xl mx-auto space-y-10 animate-in fade-in font-black text-slate-800 font-black text-slate-800">
                                <section>
                                    <h2 className="text-2xl font-black mb-6 flex items-center gap-3"><span className="p-2 bg-indigo-100 rounded-lg">🏷️</span> Алиасы Авторов</h2>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {aliases.map((group, idx) => (
                                            <div key={idx} className="bg-white p-6 rounded-[2.5rem] border-2 border-slate-100 shadow-sm relative group overflow-hidden font-black">
                                                <div className="text-indigo-600 font-black text-lg mb-4 flex items-center justify-between uppercase tracking-tighter">Группа: {group[0]}<button onClick={() => setAliases(aliases.filter((_, i) => i !== idx))} className="text-slate-300 hover:text-red-500 font-bold">&times;</button></div>
                                                <div className="flex flex-wrap gap-2 font-black font-black">{group.map((name, nIdx) => (
                                                    <span key={nIdx} className={`px-3 py-1 rounded-xl text-xs font-bold ${nIdx === 0 ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-500'}`}>{name}{nIdx > 0 && <button onClick={() => { const newA = [...aliases]; newA[idx] = group.filter((_, i) => i !== nIdx); setAliases(newA); }} className="ml-2 opacity-50">&times;</button>}</span>
                                                ))}<button onClick={() => { const val = prompt("Введите вариацию:"); if(val) { const newA = [...aliases]; newA[idx].push(val); setAliases(newA); } }} className="px-3 py-1 rounded-xl text-xs border-2 border-dashed border-slate-200 text-slate-400 font-black font-black">+</button></div>
                                            </div>
                                        ))}<button onClick={() => setAliases([...aliases, []])} className="border-4 border-dashed border-slate-200 rounded-[2rem] p-6 text-slate-300 font-black hover:border-indigo-200 hover:text-indigo-200 transition-all font-black">+ СОЗДАТЬ ГРУППУ</button>
                                    </div>
                                </section>
                                <section>
                                    <h2 className="text-2xl font-black mb-6 flex items-center gap-3 font-black text-slate-800 font-black text-slate-800 font-black text-slate-800 font-black text-slate-800 font-black text-slate-800 font-black text-slate-800"><span className="p-2 bg-amber-100 rounded-lg">🔝</span> Приоритеты Анонимности</h2>
                                    <div className="bg-white p-8 rounded-[2.5rem] border-2 border-slate-100 space-y-3 font-black text-slate-800">{anonPriority.map((root, idx) => (
                                        <div key={idx} className="flex items-center gap-4 bg-slate-50 p-4 rounded-2xl group border border-transparent hover:border-indigo-100 transition-all font-black text-slate-800 font-black text-slate-800 font-black text-slate-800 font-black text-slate-800 font-black text-slate-800">
                                            <span className="w-8 h-8 flex items-center justify-center bg-white rounded-full font-black text-indigo-600 shadow-sm text-xs font-black font-black font-black text-slate-800">{idx + 1}</span>
                                            <span className="font-bold flex-grow text-slate-700 uppercase tracking-widest font-black text-slate-800 font-black text-slate-800 font-black text-slate-800">{root}</span>
                                            <div className="flex gap-1 font-black text-slate-800 font-black text-slate-800 font-black text-slate-800 font-black text-slate-800 font-black text-slate-800 font-black text-slate-800 font-black text-slate-800 font-black text-slate-800 font-black text-slate-800 font-black text-slate-800 font-black text-slate-800 font-black text-slate-800"><button onClick={() => { if(idx === 0) return; const next = [...anonPriority]; [next[idx-1], next[idx]] = [next[idx], next[idx-1]]; setAnonPriority(next); }} className="w-10 h-10 bg-white rounded-xl shadow-sm hover:text-indigo-600 transition-colors font-black">↑</button><button onClick={() => { if(idx === anonPriority.length - 1) return; const next = [...anonPriority]; [next[idx+1], next[idx]] = [next[idx], next[idx+1]]; setAnonPriority(next); }} className="w-10 h-10 bg-white rounded-xl shadow-sm hover:text-indigo-600 transition-colors font-black text-slate-800 font-black text-slate-800">↓</button><button onClick={() => setAnonPriority(anonPriority.filter((_, i) => i !== idx))} className="w-10 h-10 bg-white rounded-xl shadow-sm hover:text-red-500 transition-colors font-black">&times;</button></div>
                                        </div>
                                    ))}<button onClick={() => { const val = prompt("Введите корень:"); if(val) setAnonPriority([...anonPriority, val.toLowerCase()]); }} className="w-full py-4 border-2 border-dashed rounded-2xl text-slate-300 font-bold hover:border-indigo-400 mt-4 transition-all uppercase text-xs font-black font-black text-slate-800 font-black font-black text-slate-800 font-black font-black text-slate-800 font-black font-black text-slate-800 font-black font-black text-slate-800 font-black font-black text-slate-800 font-black font-black text-slate-800 font-black font-black text-slate-800">+ Добавить корень</button></div>
                                </section>
                            </div>
                        )}

                        {(activeTab === 'feed' || activeTab === 'announcements') && (
                            <div className="max-w-2xl mx-auto space-y-10">
                                {activeTab === 'feed' && (
                                    <div className="flex flex-wrap items-center gap-3 p-2 bg-white rounded-2xl shadow-sm border border-slate-100 animate-in slide-in-from-top-2 font-black text-slate-800">
                                        <div className="flex bg-slate-100 rounded-xl p-1 shrink-0 font-black text-slate-800">
                                            {[{id: 'popular', label: '🔥 Популярные'}, {id: 'newest', label: '📅 Новые'}, {id: 'oldest', label: '⏳ Старые'}].map(opt => (
                                                <button key={opt.id} onClick={() => setSortOrder(opt.id)} className={`px-3 py-1.5 rounded-lg text-[10px] font-black uppercase tracking-tight transition-all ${sortOrder === opt.id ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-400 hover:text-slate-600 font-black text-slate-800'}`}>{opt.label}</button>
                                            ))}
                                        </div>
                                        {(filterAuthor || filterTag || searchQuery) && (
                                            <div className="flex items-center gap-2 font-black text-slate-800">
                                                {filterAuthor && <TagFilter label={filterAuthor} onClear={() => setFilterAuthor(null)} />}
                                                {filterTag && <TagFilter label={`#${filterTag}`} onClear={() => setFilterTag(null)} />}
                                                {searchQuery && <TagFilter label={`🔍 ${searchQuery}`} onClear={() => setSearchQuery("")} />}
                                            </div>
                                        )}
                                        <span className="ml-auto text-[10px] text-slate-400 font-bold px-4 uppercase italic shrink-0 whitespace-nowrap font-black text-slate-800">Найдено: {filteredFeed.length}</span>
                                    </div>
                                )}
                                <div className="space-y-10 font-black text-slate-800 font-black text-slate-800">
                                    {visibleFeed.map((m) => (
                                        <LazyCard key={m.id}>
                                            <div className="relative group">
                                                <div className={`absolute -left-4 top-0 bottom-0 w-1.5 rounded-full opacity-0 group-hover:opacity-100 transition-all ${m.isAnnouncement ? 'bg-orange-500' : 'bg-indigo-500'}`}></div>
                                                <div className={`bg-white p-8 md:p-10 rounded-[2.5rem] shadow-sm border group-hover:shadow-xl transition-all relative overflow-hidden font-black text-slate-800 ${m.isAnnouncement ? 'border-orange-300 bg-orange-50/20' : 'border-slate-100'}`}>
                                                    <div className="absolute right-10 top-10 text-slate-50 text-8xl font-black pointer-events-none select-none font-black text-slate-800 font-black text-slate-800">“</div>
                                                    <div className="flex flex-wrap gap-x-1 mb-8 items-center relative z-10 leading-relaxed font-black text-slate-800">
                                                        {m.isAnnouncement ? <span className="bg-orange-100 text-orange-600 px-3 py-1 rounded-xl text-[10px] font-black uppercase tracking-widest leading-none flex items-center h-6 shadow-sm border border-orange-200/50">📢 Объявление</span> : (
                                                            <div className="flex flex-wrap items-center font-black text-slate-800">
                                                                {m.visualSegments.map((seg, idx) => seg.type === 'link' ? (
                                                                    <span key={idx} onClick={()=>setFilterAuthor(seg.canonical)} className="bg-slate-900 text-white px-2 py-1 mx-0.5 rounded-lg text-[10px] font-black uppercase tracking-widest cursor-pointer hover:bg-indigo-600 transition-all whitespace-nowrap inline-block leading-none font-black text-slate-100">{seg.val}</span>
                                                                ) : (
                                                                    <span key={idx} className="text-[11px] text-slate-400 font-medium whitespace-pre leading-none h-4 inline-block font-black text-slate-800 font-black text-slate-800">{seg.val}</span>
                                                                ))}
                                                            </div>
                                                        )}
                                                        <div className="flex flex-wrap gap-1 ml-4 border-l pl-4 border-slate-100 font-black">
                                                            {m.tags.map(t => <span key={t} onClick={()=>{setFilterTag(t); setActiveTab('feed')}} className="bg-indigo-50 text-indigo-500 px-2 py-1 rounded-lg text-[10px] font-black uppercase tracking-widest cursor-pointer hover:bg-indigo-100 transition-all leading-none font-black text-slate-800 font-black text-slate-800">#{t}</span>)}
                                                        </div>
                                                        <span className="ml-auto text-slate-300 text-[10px] font-bold shrink-0 font-black leading-none font-black text-slate-800">{m.dateObj.toLocaleDateString()}</span>
                                                    </div>
                                                    <div className="quote-font text-slate-800 text-xl md:text-2xl leading-relaxed preserve-lines mb-10 relative z-10 font-normal text-slate-800">
                                                        <FormattedQuote text={m.cleanText} />
                                                    </div>
                                                    <div className="flex flex-wrap gap-3 pt-6 border-t border-slate-50 relative z-10 font-black text-slate-800 font-black text-slate-800">
                                                        {m.reactionsDetail.map((r, ri) => (
                                                            <div key={ri} className={`flex items-center pl-2 pr-4 py-1.5 rounded-2xl border group/reac transition-colors cursor-default ${r.isPaid ? 'bg-amber-50 border-amber-200 shadow-sm' : 'bg-slate-50 border-slate-100'}`} title={r.isCustom ? r.label : ''}>
                                                                <div className="w-8 h-8 flex items-center justify-center mr-1 font-black">{r.isCustom ? <StickerProvider path={r.label} /> : <span className="text-2xl leading-none font-black text-slate-800">{r.label}</span>}</div>
                                                                <span className={`font-black ${r.isPaid ? 'text-amber-700' : 'text-slate-600 font-black text-slate-800'}`}>{r.count}</span>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            </div>
                                        </LazyCard>
                                    ))}
                                </div>
                                {visibleCount < filteredFeed.length && <div className="h-20 flex items-center justify-center text-slate-400 font-bold uppercase text-[10px] tracking-widest text-center">Листайте дальше...</div>}
                            </div>
                        )}
                    </main>
                </div>
                </FileContext.Provider>
            );
        }

        const StatCard = ({ label, value, icon, isCustom, isPaid, colorClass }) => (
            <div className={`bg-white p-6 rounded-[2rem] shadow-sm border flex flex-col justify-between min-h-[140px] font-black ${isPaid ? 'border-amber-200 bg-amber-50/30 font-black text-slate-800' : 'border-slate-100'}`}>
                <div className="flex items-center justify-between mb-4 font-black text-slate-800 font-black text-slate-800 font-black text-slate-800 font-black text-slate-800 font-black text-slate-800"><span className="text-2xl font-black">{icon}</span></div>
                <div className="mb-1 h-10 flex items-center overflow-hidden font-black text-slate-800 font-black text-slate-800">
                    {isPaid ? <div className="text-2xl md:text-3xl font-black text-amber-600 tracking-tight truncate w-full font-black text-slate-800">⭐️ {value || '0'}</div> : isCustom ? <div className="w-10 h-10 scale-125 origin-left font-black text-slate-800 font-black font-black text-slate-800 font-black font-black text-slate-800"><StickerProvider path={value} /></div> : <div className={`text-2xl md:text-3xl font-black tracking-tight truncate w-full ${colorClass || 'text-slate-800'} font-black font-black text-slate-800`}>{value || '0'}</div>}
                </div>
                <div className="text-slate-400 text-[10px] font-bold uppercase tracking-widest leading-none font-black text-slate-800 font-black font-black text-slate-800">{label}</div>
            </div>
        );

        const TagFilter = ({ label, onClear }) => (
            <span className="bg-indigo-50 text-indigo-600 px-3 py-1.5 rounded-xl text-xs font-black border border-indigo-100 flex items-center gap-2 shrink-0 font-black font-black text-slate-800 font-black font-black text-slate-800 leading-none">{label}<button onClick={onClear} className="hover:bg-indigo-200 rounded-full w-4 h-4 flex items-center justify-center transition-colors font-bold text-center leading-none">&times;</button></span>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
